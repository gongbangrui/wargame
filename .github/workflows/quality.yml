name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-and-contracts:
    name: Account and script quality gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test account room lifecycle
        run: uv run --with-requirements server/account/requirements.txt python tests/test_account_room_lifecycle.py
      - name: Test account security
        run: uv run --with-requirements server/account/requirements.txt python tests/test_account_security.py
      - name: Check JavaScript contracts
        run: npm run check
      - name: Test standalone deployment scripts
        run: |
          ./tests/test_standalone_installer_guide.sh
          ./tests/test_standalone_installer_runtime_layout.sh
          ./tests/test_standalone_installer_staging.sh
          ./tests/test_standalone_lifecycle_paths.sh

  native:
    name: Native quality gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.1
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtwebsockets
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure Debug
        run: cmake --preset debug
      - name: Configure Sanitizers
        run: cmake --preset sanitizers
      - name: Build Debug
        run: cmake --build --preset debug --parallel
      - name: Build Sanitizers
        run: cmake --build --preset sanitizers --parallel
      - name: Verify test baseline
        run: ./tools/verify-test-baseline.sh build/debug build/sanitizers
      - name: Test Debug
        run: ctest --preset debug
      - name: Test Sanitizers
        run: ctest --preset sanitizers
      - name: Lint QML
        run: cmake --build build/debug --target all_qmllint --parallel
      - name: Check source format
        run: ./tools/check-source-format.sh

  docker-recovery:
    name: Docker smoke and recovery
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker deployment and recovery
        run: ./tools/verify-docker-recovery.sh
