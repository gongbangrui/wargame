name: "${WARGAME_COMPOSE_PROJECT:-wargame}"

services:
  account-web:
    image: "wargame-account-web:${WARGAME_RELEASE_ID:-dev}"
    build:
      context: ..
      dockerfile: deploy/account.Dockerfile
      args:
        WARGAME_VERSION: "${WARGAME_VERSION:-2.0.0}"
        WARGAME_SOURCE_DIGEST: "${WARGAME_SOURCE_DIGEST:-dev}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - "${WARGAME_RUNTIME_ENV_FILE:-../.env}"
    environment:
      DATA_DIR: /data
      WARGAME_SOURCE_DIGEST: "${WARGAME_SOURCE_DIGEST:-dev}"
      SESSION_HOURS: "${SESSION_HOURS:-12}"
      WEB_SHELL_ENABLED: "${WEB_SHELL_ENABLED:-false}"
      WEB_SHELL_TICKET_SECONDS: "${WEB_SHELL_TICKET_SECONDS:-120}"
      WEB_SHELL_SESSION_SECONDS: "${WEB_SHELL_SESSION_SECONDS:-900}"
      WEB_SHELL_MAX_SESSIONS: "${WEB_SHELL_MAX_SESSIONS:-2}"
      WEB_SHELL_ALLOWED_ORIGINS: "${WEB_SHELL_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}"
      LOGIN_TRUSTED_PROXIES: "${LOGIN_TRUSTED_PROXIES:-}"
      LOGIN_WINDOW_SECONDS: "${LOGIN_WINDOW_SECONDS:-60}"
      LOGIN_SUBJECT_IP_FAILURE_LIMIT: "${LOGIN_SUBJECT_IP_FAILURE_LIMIT:-5}"
      LOGIN_IP_FAILURE_LIMIT: "${LOGIN_IP_FAILURE_LIMIT:-20}"
      GAME_ROOM_ID: "${GAME_ROOM_ID:-main}"
    volumes:
      - wargame-data:/data
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 6

  game-server:
    image: "wargame-game-server:${WARGAME_RELEASE_ID:-dev}"
    build:
      context: ..
      dockerfile: deploy/game-server.Dockerfile
      args:
        WARGAME_VERSION: "${WARGAME_VERSION:-2.0.0}"
        WARGAME_SOURCE_DIGEST: "${WARGAME_SOURCE_DIGEST:-dev}"
        WARGAME_ENABLE_FASTDDS: "${WARGAME_ENABLE_FASTDDS:-OFF}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - "${WARGAME_RUNTIME_ENV_FILE:-../.env}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GAME_PORT: 8090
      AUTH_SERVICE_URL: http://account-web:8080
      SCENARIO_PATH: /data/scenario.json
      CHECKPOINT_PATH: /data/room-checkpoint.json
      COMMAND_LOG_PATH: /data/room-commands.jsonl
      GAME_ROOM_ID: "${GAME_ROOM_ID:-main}"
      ADMIN_PASSWORD: ""
      WARGAME_SOURCE_DIGEST: "${WARGAME_SOURCE_DIGEST:-dev}"
      WARGAME_ALLOW_RECOVERY_RESET: "${WARGAME_ALLOW_RECOVERY_RESET:-0}"
      AI_PROVIDER: "${AI_PROVIDER:-auto}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-auto}"
      OLLAMA_CONNECT_TIMEOUT_MS: "${OLLAMA_CONNECT_TIMEOUT_MS:-1500}"
      OLLAMA_TIMEOUT_MS: "${OLLAMA_TIMEOUT_MS:-60000}"
      OLLAMA_MAX_RESPONSE_BYTES: "${OLLAMA_MAX_RESPONSE_BYTES:-65536}"
      WARGAME_FASTDDS_MODE: "${WARGAME_FASTDDS_MODE:-disabled}"
      FASTDDS_DOMAIN_ID: "${FASTDDS_DOMAIN_ID:-0}"
      FASTDDS_DISCOVERY_TIMEOUT_MS: "${FASTDDS_DISCOVERY_TIMEOUT_MS:-5000}"
      FASTDDS_STATIC_PEERS: "${FASTDDS_STATIC_PEERS:-}"
    volumes:
      - wargame-data:/data
    ports:
      - "127.0.0.1:${WS_PORT:-8090}:8090"
    depends_on:
      account-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8090"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  wargame-data:
    name: "${WARGAME_DATA_VOLUME:-wargame-data}"
